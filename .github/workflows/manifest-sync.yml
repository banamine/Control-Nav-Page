name: Auto-Generate Manifests

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
  schedule:
    - cron: '0 * * * *' # Runs every hour automatically

jobs:
  build-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install node-html-parser tsx --save-dev

      - name: Run Crawler Script
        run: npx tsx scripts/crawler.ts

      - name: Commit and Push Generated Manifests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/manifests/
          git commit -m "chore: auto-update content manifests [skip ci]" || exit 0
          git push
