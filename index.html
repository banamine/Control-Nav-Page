    <style>
        :root {
            --bg: #0a0a0a;
            --bar: rgba(26, 26, 26, 0.95);
            --accent: #ff4500;
            --accent-glow: rgba(255, 69, 0, 0.38);
            --text: #e8e8e8;
            --border: #2e2e2e;
            --card: #141414;
            --card-hover: #1e1e1e;
            --popout-bg: rgba(255, 215, 0, 0.22);
            --popout-hover: rgba(255, 215, 0, 0.45);
            --popout-text: #ffeb3b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }
        #remote-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--bar);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            z-index: 9999;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        button, select, input {
            padding: 9px 14px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #1f1f1f;
            color: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #pop-out {
            background: var(--popout-bg);
            color: var(--popout-text);
            border-color: rgba(255,215,0,0.35);
            font-weight: 600;
        }
        #pop-out:hover {
            background: var(--popout-hover);
            box-shadow: 0 0 18px rgba(255,215,0,0.5);
            transform: translateY(-1px);
        }
        select, input[type="text"] {
            min-width: 170px;
        }
        .search-wrapper {
            position: relative;
            display: inline-block;
        }
        #search-input {
            padding-right: 36px;
            width: 240px;
        }
        #clear-search {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }
        #clear-search:hover { color: white; }
        #page-frame {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
            background: #000;
            padding-top: 70px;
            box-sizing: border-box;
        }
        #content-hub {
            padding: 85px 25px 50px;
            max-width: 1480px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--accent);
            font-size: 2.6rem;
            margin: 0 0 12px;
        }
        .center {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }
        details {
            margin: 24px 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
        }
        summary {
            padding: 16px 24px;
            background: #181818;
            font-size: 1.32rem;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            user-select: none;
        }
        summary:hover { background: #202020; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
            padding: 24px;
        }
        .item {
            position: relative;
            background: #1a1a1a;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            transition: all 0.28s ease;
        }
        .item:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 12px 28px rgba(255,69,0,0.22);
            background: #222;
        }
        .item.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent), 0 12px 28px rgba(255,69,0,0.3);
            background: #222;
            transform: translateY(-2px);
        }
        .item a {
            color: #ffaa44;
            text-decoration: none;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            margin-left: 28px; /* space for icon */
        }
        .item i.thumb-icon {
            position: absolute;
            left: 18px;
            top: 20px;
            font-size: 1.4rem;
            color: #ffaa44;
        }
        .tags {
            font-size: 0.82rem;
            color: #888;
            margin-top: 6px;
            margin-left: 28px;
        }
        .star {
            position: absolute;
            top: 12px;
            right: 14px;
            font-size: 1.45rem;
            cursor: pointer;
            color: #555;
            transition: color 0.2s;
            z-index: 10;
        }
        .star.active i { color: #ffdd57; text-shadow: 0 0 8px rgba(255,221,87,0.5); }
        .star:hover { color: #ffee88; }
        .hidden { display: none !important; }
        #fallback-notice {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            color: white;
            text-align: center;
            padding: 30px;
        }
        #fallback-notice button {
            margin-top: 20px;
            padding: 14px 32px;
            font-size: 1.1rem;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        .iframe-loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255,69,0,0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            z-index: 10001;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible, .star:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }
    </style>
</head>

        // ----- GLOBAL STATE -----
        let historyStack = JSON.parse(localStorage.getItem('libertyHistory')) || [
            { url: 'https://www.liberty-express.org/', label: 'Home' }
        ];
        let currentIndex = historyStack.length - 1;
        let ignoreNextLoad = false;

        // ----- DOM ELEMENTS -----
        const frame = document.getElementById('page-frame');
        const hub = document.getElementById('content-hub');
        const loader = document.getElementById('iframe-loader');
        const fallback = document.getElementById('fallback-notice');
        const popOutBtn = document.getElementById('pop-out');
        const backBtn = document.getElementById('back-btn');
        const fwdBtn = document.getElementById('fwd-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const homeBtn = document.getElementById('home-btn');
        const pageMenu = document.getElementById('page-menu');
        const goBtn = document.getElementById('go-btn');
        const historyMenu = document.getElementById('history-menu');
        const labelEdit = document.getElementById('label-edit');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');

        // ----- THUMBNAIL MAPPING (Font Awesome icons per category) -----
        function getIconClass(domain) {
            const map = {
                'Live TV': 'fas fa-tv',
                'Movies': 'fas fa-film',
                'Series': 'fas fa-list',
                'Radio': 'fas fa-microphone',
                'News': 'fas fa-newspaper',
                'General': 'fas fa-link'
            };
            return map[domain] || 'fas fa-file';
        }

        // ----- BUILD UI (groups by domain, adds thumbnails) -----
        function buildUI() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = '';
            const groups = {};
            catalog.items.forEach(item => {
                if (!groups[item.domain]) groups[item.domain] = [];
                groups[item.domain].push(item);
            });

            Object.entries(groups).forEach(([name, items]) => {
                const details = document.createElement('details');
                details.open = true;
                details.innerHTML = `<summary>${name} (${items.length})</summary><div class="grid"></div>`;
                const grid = details.querySelector('.grid');
                items.forEach(item => {
                    const iconClass = getIconClass(item.domain);
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <span class="star" data-url="${item.url}" data-title="${item.title}"><i class="fas fa-star"></i></span>
                        <i class="thumb-icon ${iconClass}"></i>
                        <a href="${item.url}" target="content_frame" onclick="openPage(event)">${item.title}</a>
                    `;
                    grid.appendChild(div);
                });
                container.appendChild(details);
            });
            attachStarListeners();
            renderFavorites();
        }

        // ----- NAVIGATION FUNCTIONS -----
        function openPage(e) {
            e.preventDefault();
            const url = e.currentTarget.href;
            navigateTo(url);
        }

        function navigateTo(url, label = null) {
            if (!url || url === frame.src) return;
            label = label || getLabelFromUrl(url);
            historyStack = historyStack.slice(0, currentIndex + 1);
            historyStack.push({ url, label });
            currentIndex = historyStack.length - 1;
            ignoreNextLoad = true;
            frame.src = url;
            localStorage.setItem('libertyHistory', JSON.stringify(historyStack));
            updateUI();
            showIframe();
        }

        function getLabelFromUrl(url) {
            // Try to find title from catalog
            const item = catalog.items.find(i => i.url === url);
            if (item) return item.title;
            // Fallback
            if (url.includes('liberty-express.org/')) return 'Liberty Page';
            return 'Page';
        }

        function showIframe() {
            hub.style.display = 'none';
            frame.style.display = 'block';
            popOutBtn.classList.remove('hidden');
            loader.style.display = 'block';
        }

        function showHub() {
            hub.style.display = 'block';
            frame.style.display = 'none';
            popOutBtn.classList.add('hidden');
            fallback.style.display = 'none';
            loader.style.display = 'none';
        }

        function updateUI() {
            backBtn.disabled = currentIndex <= 0;
            fwdBtn.disabled = currentIndex >= historyStack.length - 1;

            historyMenu.innerHTML = '<option value="">🕒 History...</option>';
            historyStack.forEach((entry, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = (i === currentIndex ? '→ ' : '') + entry.label;
                historyMenu.appendChild(opt);
            });
            historyMenu.value = currentIndex;

            // Active item highlight
            document.querySelectorAll('.item').forEach(item => item.classList.remove('active'));
            if (frame.src && frame.src !== 'about:blank') {
                const activeLink = document.querySelector(`.item a[href="${frame.src}"]`);
                if (activeLink) activeLink.closest('.item').classList.add('active');
            }
        }

        // ----- FAVORITES -----
        function toggleFavorite(e) {
            e.stopPropagation();
            const star = e.currentTarget;
            const url = star.dataset.url;
            const title = star.dataset.title;
            let favs = JSON.parse(localStorage.getItem('lib_favs') || '[]');
            const idx = favs.findIndex(f => f.url === url);
            if (idx >= 0) favs.splice(idx, 1);
            else favs.push({ url, title });
            localStorage.setItem('lib_favs', JSON.stringify(favs));
            renderFavorites();
        }

        function renderFavorites() {
            const favs = JSON.parse(localStorage.getItem('lib_favs') || '[]');
            const grid = document.getElementById('fav-grid');
            const section = document.getElementById('fav-section');
            section.classList.toggle('hidden', favs.length === 0);
            grid.innerHTML = '';
            favs.forEach(f => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<a href="${f.url}" target="content_frame" onclick="openPage(event)">${f.title}</a>`;
                grid.appendChild(div);
            });
            document.querySelectorAll('.star').forEach(star => {
                const active = favs.some(f => f.url === star.dataset.url);
                star.classList.toggle('active', active);
            });
        }

        function attachStarListeners() {
            document.querySelectorAll('.star').forEach(star => {
                star.removeEventListener('click', toggleFavorite);
                star.addEventListener('click', toggleFavorite);
            });
        }

        // ----- IFRAME EVENTS -----
        frame.addEventListener('load', () => {
            loader.style.display = 'none';
            fallback.style.display = 'none';
            const newUrl = frame.src;
            if (ignoreNextLoad) {
                ignoreNextLoad = false;
            } else {
                const currentEntry = historyStack[currentIndex];
                if (!currentEntry || currentEntry.url !== newUrl) {
                    const label = getLabelFromUrl(newUrl);
                    historyStack = historyStack.slice(0, currentIndex + 1);
                    historyStack.push({ url: newUrl, label });
                    currentIndex = historyStack.length - 1;
                    localStorage.setItem('libertyHistory', JSON.stringify(historyStack));
                }
            }
            updateUI();
        });

        frame.addEventListener('error', () => {
            loader.style.display = 'none';
            fallback.style.display = 'flex';
        });

        // ----- CONTROL BAR ACTIONS -----
        homeBtn.onclick = () => { showHub(); };
        backBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                ignoreNextLoad = true;
                frame.src = historyStack[currentIndex].url;
                updateUI();
            }
        };
        fwdBtn.onclick = () => {
            if (currentIndex < historyStack.length - 1) {
                currentIndex++;
                ignoreNextLoad = true;
                frame.src = historyStack[currentIndex].url;
                updateUI();
            }
        };
        refreshBtn.onclick = () => {
            frame.contentWindow?.location.reload();
            loader.style.display = 'block';
        };
        clearHistoryBtn.onclick = () => {
            if (confirm('Clear history?')) {
                historyStack = [{ url: frame.src || 'https://www.liberty-express.org/', label: 'Home' }];
                currentIndex = 0;
                localStorage.setItem('libertyHistory', JSON.stringify(historyStack));
                updateUI();
            }
        };
        popOutBtn.onclick = () => {
            if (frame.src && frame.src !== 'about:blank') window.open(frame.src, '_blank');
        };
        goBtn.onclick = () => {
            const val = pageMenu.value;
            let url = '';
            if (val === 'home') url = 'https://www.liberty-express.org/';
            else if (val === 'infowars') url = 'https://www.liberty-express.org/news--infowars.html';
            else if (val === 'westerns') url = 'https://www.liberty-express.org/big-western-channel-1.html';
            else if (val === 'canada') url = 'https://www.liberty-express.org/canada-propaganda.html';
            else if (val === 'fox') url = 'https://www.liberty-express.org/fox-news-radio.html';
            else if (val === 'rumble') url = 'https://www.liberty-express.org/rumble-player.html';
            else if (val === 'libertyradio') url = 'https://www.liberty-express.org/libertyradio.html';
            if (url) navigateTo(url);
        };
        historyMenu.onchange = (e) => {
            const i = parseInt(e.target.value);
            if (!isNaN(i) && i >= 0 && i < historyStack.length) {
                currentIndex = i;
                ignoreNextLoad = true;
                frame.src = historyStack[i].url;
                updateUI();
            }
        };
        historyMenu.onfocus = () => {
            if (currentIndex >= 0 && historyStack[currentIndex]) {
                labelEdit.style.display = 'inline-block';
                labelEdit.value = historyStack[currentIndex].label;
                labelEdit.focus();
            }
        };
        function saveLabelEdit() {
            if (labelEdit.value.trim() && currentIndex >= 0 && historyStack[currentIndex]) {
                historyStack[currentIndex].label = labelEdit.value.trim();
                localStorage.setItem('libertyHistory', JSON.stringify(historyStack));
                updateUI();
            }
            labelEdit.style.display = 'none';
        }
        labelEdit.onblur = saveLabelEdit;
        labelEdit.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); saveLabelEdit(); } };

        // ----- FILTER -----
        function filterItems() {
            const term = searchInput.value.toLowerCase().trim();
            document.querySelectorAll('.item').forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(term) ? 'block' : 'none';
            });
            clearSearchBtn.style.display = term ? 'block' : 'none';
        }
        searchInput.addEventListener('input', filterItems);
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterItems();
            searchInput.focus();
        });

        // ----- KEYBOARD SHORTCUTS -----
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
            if (e.altKey) {
                switch (e.key.toLowerCase()) {
                    case 'h': e.preventDefault(); homeBtn.click(); break;
                    case 'arrowleft': e.preventDefault(); backBtn.click(); break;
                    case 'arrowright': e.preventDefault(); fwdBtn.click(); break;
                    case 'r': e.preventDefault(); refreshBtn.click(); break;
                    case 'c': e.preventDefault(); clearHistoryBtn.click(); break;
                }
            }
            if (e.key === 'Escape') {
                if (fallback.style.display === 'flex') fallback.style.display = 'none';
                else if (frame.style.display === 'block') showHub();
            }
        });

        // ----- OPEN CURRENT IN TAB (for fallback) -----
        window.openCurrentInTab = function() {
            if (frame.src && frame.src !== 'about:blank') window.open(frame.src, '_blank');
            fallback.style.display = 'none';
        };

        // ----- INIT -----
        if (catalog && catalog.items) {
            buildUI();
        } else {
            document.getElementById('dynamic-content').innerHTML = '<h2>No data. Run the hunter again.</h2>';
        }
        updateUI();
        showHub(); // start with hub visible
    </script>
</body>
</html>
